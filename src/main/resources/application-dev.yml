# 开发环境配置 - 使用 H2 内存数据库
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:fmdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.wyy.fm: debug
    org.hibernate.SQL: debug
