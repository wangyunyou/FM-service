# 开发环境配置 - 使用本地 PostgreSQL
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/fmdb
    # 本地 Homebrew PostgreSQL 的超级用户默认就是操作系统用户名，
    # 所以默认取 ${user.name}（而不是写死某台机器的名字），换机器开箱即用。
    # 需要覆盖时：DB_USER=postgres mvn test
    username: ${DB_USER:${user.name}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# 开发环境放开本地来源，方便 H5 / 浏览器调试（test-api.html 以 file:// 打开时 Origin 为 null）
# 生产默认不配，见 application.yml
app:
  cors:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*,null"

# 开发环境打开接口文档：http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 开发环境没有真实小程序密钥，打开 mock 登录：任意 code 即可拿到 token
# 严禁在生产设 WX_MOCK_LOGIN=true
wx:
  miniapp:
    mock-enabled: true

# JWT 开发环境默认值（仅开发用，生产环境必须通过环境变量提供）
jwt:
  secret: ${JWT_SECRET:dev-default-secret-for-testing-only}

logging:
  level:
    com.wyy.fm: info
    org.hibernate.SQL: warn
